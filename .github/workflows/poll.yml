name: poll

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python watcher.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}

      - name: Commit seen.json if changed
        run: |
          if ! git diff --quiet seen.json 2>/dev/null; then
            git config user.name "tee-watch-bot"
            git config user.email "tee-watch-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json"
            git push
          fi
