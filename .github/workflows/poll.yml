name: poll

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Opt JS actions (e.g. setup-python@v5) into Node 24 ahead of the forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python watcher.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}

      # Daily heartbeat: keeps the repo "active" so GitHub doesn't disable the
      # schedule after 60 days of inactivity. Date-only, so it changes at most
      # once per day -> one extra commit/day rather than one per 10-min run.
      - name: Heartbeat
        run: date -u +%Y-%m-%d > .heartbeat

      - name: Commit state if changed
        run: |
          git config user.name "tee-watch-bot"
          git config user.email "tee-watch-bot@users.noreply.github.com"
          git add seen.json .heartbeat
          if ! git diff --cached --quiet; then
            git commit -m "update state ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
